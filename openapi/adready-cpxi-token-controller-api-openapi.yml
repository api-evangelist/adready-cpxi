openapi: 3.2.0
info:
  title: Kickstart Token Controller API
  description: API documentation for Kickstart services
  contact:
    name: Your Team
    email: support@example.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: '1.0'
servers:
- url: https://platform.digitalremedy.com
  description: Generated server url
tags:
- name: token-controller
paths:
  /api/token/thoughtSpot:
    get:
      tags:
      - token-controller
      operationId: generateThoughtSpotToken
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                type: object
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseThoughtSpotToken'
  /api/token/tableau:
    get:
      tags:
      - token-controller
      operationId: tableauJwtToken
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                type: object
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseString'
  /api/token/tableau/{advertiserId}:
    get:
      tags:
      - token-controller
      operationId: tableauJwtToken_1
      parameters:
      - name: advertiserId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                type: object
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseString'
  /api/token/tableau/sign/{advertiserId}:
    get:
      tags:
      - token-controller
      operationId: tableauSignInTokenByAdvertiser
      parameters:
      - name: advertiserId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                type: object
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseString'
  /api/token/tableau/account/{accountId}:
    get:
      tags:
      - token-controller
      operationId: tableauJwtTokenByAccount
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                type: object
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseString'
  /api/token/refresh:
    get:
      tags:
      - token-controller
      operationId: refreshToken
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                type: object
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseTokenWrapper'
  /api/token/parse:
    get:
      tags:
      - token-controller
      operationId: parseJwtToken
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                type: object
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseTokenWrapper'
  /api/token/remove:
    delete:
      tags:
      - token-controller
      operationId: removeJwtToken
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                type: object
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
components:
  schemas:
    ApiResponseTokenWrapper:
      type: object
      properties:
        status:
          type: integer
          format: int32
        message:
          type: string
        result:
          $ref: '#/components/schemas/TokenWrapper'
    ApiResponseThoughtSpotToken:
      type: object
      properties:
        status:
          type: integer
          format: int32
        message:
          type: string
        result:
          $ref: '#/components/schemas/ThoughtSpotToken'
    TokenWrapper:
      type: object
      properties:
        apps:
          type: array
          items:
            type: integer
            format: int32
        expires:
          type: integer
          format: int64
        orgId:
          type: integer
          format: int32
        userId:
          type: integer
          format: int64
        email:
          type: string
    ThoughtSpotToken:
      type: object
      properties:
        userName:
          type: string
        authToken:
          type: string
    ApiResponseString:
      type: object
      properties:
        status:
          type: integer
          format: int32
        message:
          type: string
        result:
          type: string
