  /api/ac/advertisers/{advertiserId}/solutions/{solutionId}/search/top_performers:
    get:
      tags:
      - 'App Console: Search'
      summary: Get dimension-wise top performing metrics for Search solution
      operationId: getSearchTopPerformers
      parameters:
      - name: advertiserId
        in: path
        description: The advertiser id
        required: true
        schema:
          type: integer
      - name: solutionId
        in: path
        description: The solution id
        required: true
        schema:
          type: integer
      - name: dimension
        in: query
        description: 'The dimensions (comma-separated) by which data is grouped: campaign, adgroup, country, state, dma, zipcode, county, city, ad, adType, keyword, matchType'
        schema:
          type: string
          default: ad,adType
          enum:
          - campaign
          - adgroup
          - country
          - state
          - dma
          - zipcode
          - county
          - city
          - ad
          - adType
          - keyword
          - matchType
      - name: client
        in: query
        description: The account/client name
        required: true
        schema:
          type: string
      - name: advertiser
        in: query
        description: The advertiser name
        required: true
        schema:
          type: string
      - name: keywords
        in: query
        description: Comma-separated keywords to filter
        schema:
          type: string
      - name: creatives
        in: query
        description: Comma-separated creative ids to filter
        schema:
          type: string
      - name: campaignIds
        in: query
        description: Comma-separated Campaign ids to filter
        schema:
          type: string
      - name: adGroups
        in: query
        description: Comma-separated AdReady Id & start date (separated by |) combinations
        schema:
          type: string
      - name: startDate
        in: query
        description: The start date
        required: true
        schema:
          type: string
          format: date
        example: '2023-06-08'
      - name: endDate
        in: query
        description: The end date
        required: true
        schema:
          type: string
          format: date
        example: '2023-06-14'
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                type: object
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseListSearchTopPerformer'
