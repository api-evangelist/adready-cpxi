          type: integer
          format: int32
        message:
          type: string
        result:
          type: array
          items:
            $ref: '#/components/schemas/SearchMetricsByDimension'
    SearchTopPerformer:
      type: object
      properties:
        name:
          type: string
        dimension:
          type: string
        cpc: {}
        cpcInfinity:
          type: boolean
        cpa: {}
        cpaInfinity:
          type: boolean
        roas: {}
        roasInfinity:
          type: boolean
        ctr: {}
        ctrInfinity:
          type: boolean
    ComparisonDataNumber:
      type: object
      properties:
        currentValue:
          type: number
        compareValue:
          type: number
        change:
          type: number
          format: double
        isCurrentInfinity:
          type: boolean
        isCompareInfinity:
          type: boolean
        isChangeInfinity:
