  /api/advertisers/{advertiserId}/brand_lift/campaign/{blCampaignId}/spc_groupings_and_mappings:
    put:
      tags:
      - Flip Dashboard
      summary: Update SPC Groupings and Mappings
      operationId: updateSPCGroupings
      parameters:
      - name: advertiserId
        in: path
        description: the advertiser id
        required: true
        schema:
          type: integer
      - name: blCampaignId
        in: path
        description: Brandlift campaign id
        required: true
        schema:
          type: string
      - name: client
        in: query
        description: the account/client name
        required: true
        schema:
          type: string
      - name: advertiser
        in: query
        description: the advertiser name
        required: true
        schema:
          type: string
      - name: type
        in: query
        description: 'SPC Grouping types: placement or publisher'
        required: true
        schema:
          type: string
          enum:
          - placement
          - publisher
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                additionalProperties: {}
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                type: object
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseLucidSPCGroupingsWrapper'
  /api/advertisers/{advertiserId}/reports/rollup:
    post:
      tags:
      - Flip Dashboard
      summary: Get rollup report with only last touches for each conversion
      operationId: getLastTouches
      parameters:
      - name: advertiserId
        in: path
        description: the advertiser id
        required: true
        schema:
          type: integer
      - name: kind
        in: query
        description: the kind of data to be returned, either all_touch or last_touch
        required: true
        schema:
          type: string
          enum:
          - all_touch
          - last_touch
      - name: includeChannel
        in: query
        description: 'true : Include channel false : Dont include channel'
        required: true
        schema:
          type: boolean
      - name: client
        in: query
        description: the account/client name
        required: true
        schema:
          type: string
      - name: advertiser
        in: query
        description: the advertiser name
        required: true
        schema:
          type: string
      - name: xandrId
        in: query
        description: the advertiser's XandrId
        required: true
        schema:
          type: string
      - name: pixel
        in: query
        description: the FLIP universal pixel id
        required: true
        schema:
          type: string
      - name: conversionWindow
        in: query
        description: the conversion window in hours
        schema:
          type: integer
          default: 0
      - name: mediaType
        in: query
        description: the media types to filter (e.g. Display Retargeting, OTT, etc.)
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: creative
        in: query
        description: the comma-separated creative ids to filter
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: publisher
        in: query
        description: the comma-separated publisher names to filter
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: audience
        in: query
        description: the comma-separated audience names to filter
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: ioIds
        in: query
        description: the comma-separated IO ids to filter
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: adGroups
        in: query
        description: the comma-separated Adready Id & start date (separated by |) combination to filter
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: event
        in: query
        description: the event
        required: true
        schema:
          type: string
      - name: category
        in: query
        description: the pixel category
        required: true
        schema:
          type: string
      - name: subCategory
        in: query
        description: the comma-separated pixel sub-categories
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: startDate
        in: query
        description: the start date
        required: true
        schema:
          type: string
          example: '2022-01-08'
      - name: endDate
        in: query
        description: the end date
        required: true
        schema:
          type: string
          example: '2022-01-14'
      - name: offset
        in: query
        description: the number of records to skip
        schema:
          type: integer
          default: 0
      - name: limit
        in: query
        description: the max number of records to return
        schema:
          type: integer
          default: 100
      - name: onceNow
        in: query
        description: Run this report once?
        schema:
          type: boolean
          default: true
      - name: emailIt
        in: query
        description: Email this report?
        schema:
          type: boolean
          default: false
      - name: emailAddr
        in: query
        description: Email address?
        schema:
          type: string
      - name: Accept
        in: header
        description: '''application/json'' - provides json response. ''text/csv'' or ''application/csv'' provides csv file.'
        schema:
          type: string
          default: application/json
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                type: object
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseListObject'
