openapi: 3.2.0
info:
  title: Kickstart Flip Dashboard API
  description: API documentation for Kickstart services
  contact:
    name: Your Team
    email: support@example.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: '1.0'
servers:
- url: https://platform.digitalremedy.com
  description: Generated server url
tags:
- name: Flip Dashboard
  description: APIs related to Flip Dashboard
paths:
  /api/advertisers/{advertiserId}/flipPixels/{pixelId}:
    get:
      tags:
      - Flip Dashboard
      summary: Get details of a FLIP pixel for an advertiser
      description: Returns metadata for a given FLIP pixel and advertiser
      operationId: fetchFlipPixelDetails
      parameters:
      - name: advertiserId
        in: path
        description: The advertiser ID
        required: true
        schema:
          type: integer
      - name: pixelId
        in: path
        description: The FLIP pixel ID
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                type: object
        '200':
          description: Pixel details successfully retrieved
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseFlipPixel'
    put:
      tags:
      - Flip Dashboard
      summary: Update an existing FLIP pixel for an advertiser
      description: Updates a FLIP pixel's properties using the provided data
      operationId: updateFlipPixel
      parameters:
      - name: advertiserId
        in: path
        description: The advertiser ID
        required: true
        schema:
          type: integer
      - name: pixelId
        in: path
        description: The pixel ID
        required: true
        schema:
          type: string
      requestBody:
        description: The updated FlipPixel object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlipPixel'
        required: true
      responses:
        '400':
          description: Invalid input
        '200':
          description: Pixel updated successfully
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseFlipPixel'
        '404':
          description: Pixel not found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseFlipPixel'
  /api/advertisers/{advertiserId}/brand_lift/campaigns/{blCampaignId}:
    put:
      tags:
      - Flip Dashboard
      summary: Update campaign
      operationId: updateCampaign
      parameters:
      - name: advertiserId
        in: path
        description: the advertiser id
        required: true
      - name: blCampaignId
        in: path
        description: Campaign Id
        required: true
      requestBody:
        description: Campaign to be created
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExistingLucidCampaign'
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                type: object
        '200':
          description: OK
          content:
            application/json: {}
    delete:
      tags:
      - Flip Dashboard
      summary: Delete campaign
      operationId: deleteCampaign
      parameters:
      - name: advertiserId
        in: path
        description: the advertiser id
        required: true
      - name: blCampaignId
        in: path
        description: Campaign Id
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                type: object
        '200':
          description: OK
          content:
            application/json: {}
  /api/advertisers/{advertiserId}/brand_lift/campaigns/{blCampaignId}/launch:
    put:
      tags:
      - Flip Dashboard
      summary: Launch Campaign
      operationId: launchCampaign
      parameters:
      - name: advertiserId
        in: path
        description: the advertiser id
        required: true
