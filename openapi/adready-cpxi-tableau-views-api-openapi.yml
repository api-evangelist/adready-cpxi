servers:
- url: https://platform.digitalremedy.com
  description: Generated server url
tags:
- name: Tableau Views
paths:
  /api/tableau/views/account/{accountId}:
    get:
      tags:
      - Tableau Views
      summary: Get Tableau views for an account
      description: Retrieve a list of Tableau views belonging to a specific account ID
      operationId: tableauViewsForAccount
      parameters:
      - name: accountId
        in: path
        description: The account ID
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                type: object
        '200':
          description: List of Tableau views
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponse'
components:
  schemas:
    ApiResponse:
      type: object
      properties:
        status:
          type: integer
          format: int32
        message:
          type: string
        result: {}
