      parameters:
      - name: advertiserIdType
        in: query
        required: false
        schema:
          type: string
      - name: advertiserId
        in: query
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                type: object
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseAdvertiserMappingResponse'
