apis:
- name: Digital Remedy Platform (Kickstart) API
  description: 'The REST API behind the Digital Remedy Platform / AdReady+ web application. 285 paths and 355 operations
    covering accounts, organizations, agencies and advertisers; users and permissions; media plans, insertion orders,
    line items and budget groups; rate cards, media publishers, publisher deals and segments; Flip attribution pixels
    and dashboards; incrementality and performance reporting; App Console solution, brand, search, social and Converged
    TV management; white-label domains; and embedded Tableau / ThoughtSpot analytics tokens. The OpenAPI 3.1 description
    is served anonymously by springdoc at /v3/api-docs with a Swagger UI at /swagger-ui.html, but the API itself
    is a private first-party application backend: it is not documented for third parties, has no published onboarding,
    and every business operation returns HTTP 401 without a session JWT obtained from POST /api/auth/login.'
