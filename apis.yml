name: AdReady (CPXi)
description: 'AdReady is a digital advertising execution brand now operated by Digital Remedy (formerly
  CPX Interactive / CPXi). Digital Remedy runs an omnichannel advertising platform (AdReady+) for agencies,
  brands and media companies, covering campaign planning, programmatic/CTV/DOOH execution, measurement
  and attribution, with a RemyAI assistant and 100+ martech API integrations. AdReady originated as a
  Seattle self-serve ad-building tool and was acquired by CPXi in 2013; the brand and platform are today
  part of Digital Remedy. This company profile is maintained in the API Evangelist network; Digital Remedy
  publishes no public developer API or documentation portal, but does operate a SOC 2 trust center.'
