name: AdReady (CPXi)
description: AdReady is a digital advertising execution brand operated by Digital Remedy (formerly CPX Interactive
  / CPXi). Digital Remedy runs an omnichannel advertising management platform - marketed as the Digital Remedy Platform
  and historically as AdReady+ - for independent agencies, brands and media companies, covering media planning,
  RFPs, insertion-order and line-item management, programmatic / CTV / DOOH / social execution, pixel-based attribution
  (Flip), incrementality and brand-lift measurement, white-label reporting and a RemyAI assistant, on top of 100+
  martech integrations and 300+ inventory and data sources. AdReady originated as a Seattle self-serve ad-building
  tool and was acquired by CPXi in 2013; the brand and platform are today part of Digital Remedy, which has since
  combined with Compulse. The platform is powered by an internally-named Kickstart API - a Spring Boot / springdoc
  REST service whose OpenAPI 3.1 description is served anonymously at platform.digitalremedy.com/v3/api-docs with
  a browsable Swagger UI - but Digital Remedy publishes no public developer portal, no onboarding, and no partner
  API documentation, and every business operation on that API is authenticated (HTTP 401 without a session JWT).
  This company profile is independently maintained in the API Evangelist network.
